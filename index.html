<!DOCTYPE html>
<html lang="en" data-theme="carbon">
<head>
  <meta charset="UTF-8" />
  <title>Hold the Frequency — Chrysasynth Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<script src="./Tone.js"></script>
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500&display=swap');

    :root {
      --font-display: 'Cinzel', serif;
      --font-body: 'Inter', system-ui, sans-serif;

      --bg: #0d0f12;
      --bg-deep: #090a0d;
      --text-1: #f5f3f8;
      --text-2: rgba(245,243,248,0.72);
      --text-3: rgba(245,243,248,0.44);
      --stroke: rgba(255,255,255,0.09);
      --surface: rgba(255,255,255,0.045);
      --surface-strong: rgba(255,255,255,0.07);

      --r-pill: 999px;
      --timer-progress: 0;
      --chakra-color: #c4b5fd;
      --chakra-glow: rgba(196,181,253,0.25);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }
body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;

  font-family: var(--font-body);
  color: var(--text-1);

  background:
    radial-gradient(circle at 50% 28%, var(--chakra-glow) 0%, transparent 28%),
    radial-gradient(circle at 50% 88%, rgba(255,255,255,0.025) 0%, transparent 32%),
    linear-gradient(180deg, #111318 0%, var(--bg) 48%, var(--bg-deep) 100%);

  overflow-x: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
    button, input {
      font: inherit;
    }

   .app-shell {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;
  background: transparent;
}

 .app-shell::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;

  background:
    linear-gradient(
      115deg,
      transparent 0 46%,
      rgba(255,255,255,0.018) 50%,
      transparent 54%
    ),
    radial-gradient(
      circle at 50% 0%,
      rgba(255,255,255,0.045),
      transparent 36%
    );

  opacity: .8;
}

    .app {
      position: relative;
      width: min(100%, 460px);
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(18px, env(safe-area-inset-top))
        20px
        max(18px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto minmax(150px, 1fr) auto minmax(185px, auto) auto auto;
      align-items: center;
      gap: 14px;
      isolation: isolate;
      user-select: none;
    }

    .app::before {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, var(--chakra-glow) 0%, transparent 68%);
      filter: blur(34px);
      opacity: .75;
      transition: background 1.2s ease, opacity 1.2s ease;
      z-index: -1;
    }

    .session-bar {
      width: 100%;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .session-seg {
      flex: 1;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      overflow: hidden;
      transition: background .5s ease, box-shadow .5s ease;
    }

    .session-seg.done {
      background: var(--chakra-seg-color, rgba(255,255,255,.5));
      box-shadow: 0 0 10px color-mix(in srgb, var(--chakra-seg-color, white) 45%, transparent);
    }

    .session-seg.active {
      background: linear-gradient(
        to right,
        var(--chakra-color) calc(var(--timer-progress) * 100%),
        rgba(255,255,255,0.12) 0
      );
    }

    .app-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .app-header h1 {
      font-family: var(--font-display);
      font-size: .68rem;
      font-weight: 400;
      letter-spacing: .20em;
      text-transform: uppercase;
      color: var(--text-2);
      white-space: nowrap;
    }

    .badge {
      font-size: .66rem;
      letter-spacing: .04em;
      padding: 6px 10px;
      border-radius: var(--r-pill);
      color: var(--text-2);
      background: var(--surface);
      border: 1px solid var(--stroke);
      white-space: nowrap;
      backdrop-filter: blur(12px);
    }

    .flask-wrapper {
      width: 100%;
      min-height: 150px;
      display: grid;
      place-items: center;
      position: relative;
    }

    .flask-wrapper::before {
      content: "";
      position: absolute;
      width: min(64vw, 260px);
      height: min(64vw, 260px);
      border-radius: 50%;
      background: radial-gradient(circle, var(--chakra-glow), transparent 67%);
      filter: blur(24px);
      opacity: .9;
      transition: background 1.1s ease;
    }

    .flask {
      width: clamp(148px, 43vw, 182px);
      height: clamp(148px, 43vw, 182px);
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.13), transparent 35%),
        radial-gradient(circle at 55% 65%, #101216 0%, #08090b 72%);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -24px 44px rgba(0,0,0,.52),
        0 18px 46px rgba(0,0,0,.40),
        0 0 44px var(--chakra-glow);
      animation: flaskBreathe 5s ease-in-out infinite;
      z-index: 1;
    }

    .flask::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(circle at 32% 18%, rgba(255,255,255,.20), transparent 24%),
        linear-gradient(140deg, rgba(255,255,255,.04), transparent 38%);
      mix-blend-mode: screen;
    }

    @keyframes flaskBreathe {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }

    .flask-layer {
      flex: 1;
      position: relative;
      opacity: .11;
      transition: opacity .6s ease, transform .6s ease, filter .6s ease;
      filter: saturate(.9);
    }

    .flask-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.13), transparent 60%);
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity .6s ease;
    }

    .flask-layer.completed {
      opacity: .82;
      filter: saturate(1.08);
    }

    .flask-layer.completed::after { opacity: .5; }

    .flask-layer.pulse { animation: layerPulse .9s ease-out; }

    @keyframes layerPulse {
      from { transform: scaleY(1); }
      40% { transform: scaleY(1.08); }
      to { transform: scaleY(1); }
    }

    .flask.glow-final {
      animation: flaskBreathe 5s ease-in-out infinite, flaskGlow 2s ease-out forwards;
    }

    @keyframes flaskGlow {
      0% { box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 18px 46px rgba(0,0,0,.4), 0 0 38px var(--chakra-glow); }
      40% { box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 20px 50px rgba(0,0,0,.45), 0 0 70px rgba(255,255,255,.24); }
      100% { box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 18px 46px rgba(0,0,0,.4), 0 0 48px rgba(255,255,255,.16); }
    }

    .chips-row {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .chip {
      min-height: 32px;
      padding: 6px 10px;
      border-radius: var(--r-pill);
      border: 1px solid rgba(255,255,255,.075);
      background: rgba(255,255,255,.035);
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .69rem;
      letter-spacing: .02em;
      cursor: pointer;
      transition: transform .12s ease, background .2s ease, border-color .25s ease, box-shadow .25s ease, color .25s ease;
      backdrop-filter: blur(10px);
    }

    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: 0 0 auto;
      opacity: .9;
    }

    @media (hover:hover) {
      .chip:hover {
        transform: translateY(-1px);
        background: rgba(255,255,255,.06);
      }
    }

    .chip.active {
      color: var(--text-1);
      border-color: color-mix(in srgb, var(--chakra-color) 64%, transparent);
      background: color-mix(in srgb, var(--chakra-color) 8%, rgba(255,255,255,.035));
      box-shadow: 0 0 18px var(--chakra-glow);
    }

    .chip.active .chip-dot {
      box-shadow: 0 0 9px var(--chakra-color);
    }

    .chip.completed {
      color: rgba(255,255,255,.78);
      border-color: rgba(255,255,255,.12);
    }

    .hold-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .hold-caption {
      font-family: var(--font-display);
      font-size: .67rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: .22em;
      color: var(--text-2);
    }

    .timer-ring {
      width: clamp(132px, 37vw, 154px);
      height: clamp(132px, 37vw, 154px);
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 5px;
      background: conic-gradient(
        var(--chakra-color) calc(var(--timer-progress) * 360deg),
        rgba(255,255,255,.08) 0deg
      );
      box-shadow: 0 0 32px var(--chakra-glow);
      transition: box-shadow .4s ease;
    }

    .timer-ring.idle {
      background: conic-gradient(rgba(255,255,255,.10) 0deg, rgba(255,255,255,.035) 360deg);
      box-shadow: 0 0 24px rgba(0,0,0,.25);
    }

    .hold-btn {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.08);
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,.07), transparent 44%),
        linear-gradient(180deg, #12151a, #090a0d);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 -16px 30px rgba(0,0,0,.35);
      transition: transform .09s ease, box-shadow .25s ease, border-color .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .hold-btn::before,
    .hold-btn::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .hold-btn::before {
      width: 66%;
      height: 66%;
      border: 1px solid rgba(255,255,255,.08);
    }

    .hold-btn::after {
      width: 88%;
      height: 88%;
      border: 1px solid rgba(255,255,255,.035);
    }

    .hold-core {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      position: relative;
      z-index: 2;
      background: radial-gradient(circle at 38% 28%, rgba(255,255,255,.36), rgba(255,255,255,.08) 40%, rgba(255,255,255,.02) 72%);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 0 18px rgba(255,255,255,.10);
      transition: transform .35s ease, box-shadow .35s ease, background .35s ease;
    }

    .hold-btn.active {
      transform: scale(.985);
      border-color: color-mix(in srgb, var(--chakra-color) 55%, transparent);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        inset 0 -16px 30px rgba(0,0,0,.25),
        0 0 34px var(--chakra-glow);
    }

    .hold-btn.active .hold-core {
      background: radial-gradient(circle at 38% 28%, rgba(255,255,255,.68), var(--chakra-color) 28%, color-mix(in srgb, var(--chakra-color) 24%, transparent) 72%);
      border-color: color-mix(in srgb, var(--chakra-color) 70%, white 10%);
      box-shadow: 0 0 28px var(--chakra-glow), 0 0 10px var(--chakra-color);
      animation: corePulse 2s ease-in-out infinite;
    }

    @keyframes corePulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: .82; transform: scale(.90); }
    }

    .timer-text {
      font-size: .68rem;
      color: var(--text-2);
      letter-spacing: .03em;
      text-align: center;
      min-height: 1em;
    }

    .status-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-top: 2px;
    }

    .chakra-name {
      font-family: var(--font-display);
      font-size: .82rem;
      font-weight: 400;
      color: var(--text-1);
      letter-spacing: .055em;
    }

    .chakra-freq {
      margin-top: 3px;
      font-size: .66rem;
      color: var(--text-2);
      letter-spacing: .025em;
    }

    .status-pill {
      padding: 6px 10px;
      border-radius: var(--r-pill);
      border: 1px solid var(--stroke);
      background: var(--surface);
      font-size: .68rem;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      color: var(--text-1);
      backdrop-filter: blur(10px);
    }

    .status-pill.complete {
      background: rgba(255,255,255,.07);
      border-color: rgba(255,255,255,.13);
    }

    .status-pill-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #7fe0aa;
      box-shadow: 0 0 7px rgba(127,224,170,.65);
    }

    .volume-row {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto 1fr;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.025);
      border: 1px solid rgba(255,255,255,.055);
    }

    .vol-label, .tone-label {
      font-size: .59rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      background: rgba(255,255,255,.12);
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #e8e8ea;
      border: 3px solid #181a1f;
      box-shadow: 0 0 0 1px rgba(255,255,255,.10);
    }

    .slider::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #e8e8ea;
      border: 3px solid #181a1f;
      box-shadow: 0 0 0 1px rgba(255,255,255,.10);
    }

    .debug-hotspot {
      position: absolute;
      top: max(6px, env(safe-area-inset-top));
      right: 6px;
      width: 24px;
      height: 24px;
      border: 0;
      background: transparent;
      opacity: 0;
      z-index: 20;
    }

    .debug-hotspot.debug-on {
      opacity: .45;
      background: radial-gradient(circle, rgba(255,255,255,.7), transparent 70%);
    }

    .hold-section,
    .timer-ring,
    .hold-btn,
    .hold-btn *,
    .chip,
    .chip * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

  .start-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: grid;
  place-items: center;

  padding:
    max(24px, env(safe-area-inset-top))
    22px
    max(24px, env(safe-area-inset-bottom));

  background: rgba(9, 10, 13, 0.58);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  overscroll-behavior: none;
}
    .start-card {
      width: min(100%, 340px);
      padding: 28px 22px;
      border-radius: 24px;
      text-align: center;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 22px 60px rgba(0,0,0,.32);
      backdrop-filter: blur(18px);
    }

    .start-title {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-1);
      margin-bottom: 9px;
    }

    .start-subtitle {
      font-size: .78rem;
      color: var(--text-2);
      margin-bottom: 20px;
    }

    .start-btn {
      min-width: 160px;
      min-height: 44px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: var(--r-pill);
      padding: 12px 18px;
      background: #f1f1f2;
      color: #111318;
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .04em;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
      transition: transform .12s ease, opacity .12s ease;
    }

    .start-btn:active { transform: scale(.985); }
    .start-btn:disabled { opacity: .6; cursor: wait; }

    @media (min-width: 700px) {
      .app {
        padding-left: 28px;
        padding-right: 28px;
      }
    }

    @media (max-width: 370px) {
      .app {
        padding-left: 14px;
        padding-right: 14px;
        gap: 10px;
      }

      .app-header h1 { font-size: .62rem; }
      .badge { font-size: .60rem; padding: 5px 8px; }
      .chip { min-height: 29px; padding: 5px 8px; font-size: .64rem; }
      .volume-row { gap: 7px; padding-inline: 9px; }
    }

    @media (max-height: 720px) {
      .app {
        gap: 8px;
        grid-template-rows: auto auto minmax(122px, 1fr) auto minmax(150px, auto) auto auto;
      }

      .flask {
        width: 132px;
        height: 132px;
      }

      .timer-ring {
        width: 120px;
        height: 120px;
      }

      .chip {
        min-height: 28px;
        padding-block: 4px;
      }

      .hold-caption { font-size: .60rem; }
      .timer-text { font-size: .63rem; }
      .volume-row { padding-top: 8px; padding-bottom: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

  </style>
</head>
<body>
  <div id="startScreen" class="start-screen">
  <div class="start-card">
    <div class="start-title">Hold the Frequency</div>
    <div class="start-subtitle">A sonic focus experiment</div>
    <button id="enableAudioBtn" class="start-btn">Enable Audio</button>
  </div>
</div>
<div class="app-shell">
  <button id="debugToggle" class="debug-hotspot" aria-hidden="true" tabindex="-1"></button>

  <div class="app">

    <div class="session-bar" id="sessionBar"></div>

    <header class="app-header">
      <div class="title-block"><h1>Chrysasynth Studio</h1></div>
      <div class="badge">7 chakras · 7 minutes</div>
    </header>

    <div class="flask-wrapper">
      <div class="flask" id="flask">
        <div class="flask-layer" data-index="0"></div>
        <div class="flask-layer" data-index="1"></div>
        <div class="flask-layer" data-index="2"></div>
        <div class="flask-layer" data-index="3"></div>
        <div class="flask-layer" data-index="4"></div>
        <div class="flask-layer" data-index="5"></div>
        <div class="flask-layer" data-index="6"></div>
      </div>
    </div>

    <div class="chips-row" id="chakraChips"></div>

    <section class="hold-section">
      <div class="hold-caption">Hold the frequency</div>
      <div class="timer-ring idle" id="timerRing">
        <button class="hold-btn" id="holdButton">
          <div class="hold-core"></div>
        </button>
      </div>
      <div class="timer-text">
        <span id="timerDisplay">00:00</span> ·
        <span id="timerStatus">Ready</span> ·
        <span id="holdHint">Hold for 60s</span>
      </div>
    </section>

    <div class="status-row">
      <div>
        <div class="chakra-name" id="chakraName"></div>
        <div class="chakra-freq" id="chakraFreq"></div>
      </div>
      <div class="status-pill" id="sessionStatus">
        <span id="sessionStatusText">0/7</span>
      </div>
    </div>

    <div class="volume-row">
      <span class="vol-label">Vol</span>
      <input id="volumeSlider" class="slider" type="range" min="0" max="100" value="40" />
      <span class="tone-label">Tone</span>
      <input id="toneSlider" class="slider" type="range" min="0" max="100" value="60" />
    </div>

  </div>
</div>

<script>
const chakras = [
  { name:"Root",      freq:396, color:"#f97373", glow:"rgba(249,115,115,0.22)", binauralDiff:5.5, reverbDecay:2.5, reverbWet:0.22, gainComp:1.00, filterCeil:2200, fadeIn:0.7 },
  { name:"Sacral",    freq:417, color:"#fb923c", glow:"rgba(251,146,60,0.22)",  binauralDiff:5.0, reverbDecay:2.8, reverbWet:0.24, gainComp:0.98, filterCeil:2000, fadeIn:0.75 },
  { name:"Solar",     freq:528, color:"#facc15", glow:"rgba(250,204,21,0.20)",  binauralDiff:4.0, reverbDecay:3.0, reverbWet:0.26, gainComp:0.95, filterCeil:1800, fadeIn:0.8 },
  { name:"Heart",     freq:639, color:"#4ade80", glow:"rgba(74,222,128,0.20)",  binauralDiff:3.5, reverbDecay:3.2, reverbWet:0.28, gainComp:0.92, filterCeil:1600, fadeIn:0.85 },
  { name:"Throat",    freq:741, color:"#38bdf8", glow:"rgba(56,189,248,0.22)",  binauralDiff:2.5, reverbDecay:3.8, reverbWet:0.34, gainComp:0.88, filterCeil:1300, fadeIn:1.0 },
  { name:"Third Eye", freq:852, color:"#818cf8", glow:"rgba(129,140,248,0.22)", binauralDiff:2.0, reverbDecay:4.2, reverbWet:0.38, gainComp:0.84, filterCeil:1100, fadeIn:1.1 },
  { name:"Crown",     freq:963, color:"#c4b5fd", glow:"rgba(196,181,253,0.22)", binauralDiff:1.5, reverbDecay:4.8, reverbWet:0.42, gainComp:0.80, filterCeil:950,  fadeIn:1.2 }
];

const HOLD_DURATION_BASE  = 60000;
const HOLD_DURATION_DEBUG = 3000;
let DEBUG = false;
const getHoldDuration = () => DEBUG ? HOLD_DURATION_DEBUG : HOLD_DURATION_BASE;

let currentChakra = 0;
let completed = new Array(chakras.length).fill(false);
let holdStart  = null;
let holdRafId  = null;
let isHolding  = false;
let holdRequested = false;
let audioReady  = false;
let audioNodes  = null;
let volumeScalar = 0.05;
let toneScalar   = 0.6;
let audioPrimed = false;

const chipsContainer   = document.getElementById("chakraChips");
const flaskEl          = document.getElementById("flask");
const flaskLayers      = [...document.querySelectorAll(".flask-layer")];
const holdButton       = document.getElementById("holdButton");
const timerRing        = document.getElementById("timerRing");
const timerDisplay     = document.getElementById("timerDisplay");
const timerStatus      = document.getElementById("timerStatus");
const holdHint         = document.getElementById("holdHint");
const chakraNameEl     = document.getElementById("chakraName");
const chakraFreqEl     = document.getElementById("chakraFreq");
const sessionStatus    = document.getElementById("sessionStatus");
const sessionStatusTxt = document.getElementById("sessionStatusText");
const debugToggle      = document.getElementById("debugToggle");
const rootStyle        = document.documentElement.style;
const volumeSlider     = document.getElementById("volumeSlider");
const toneSlider       = document.getElementById("toneSlider");
const sessionBarEl     = document.getElementById("sessionBar");
const startScreen = document.getElementById("startScreen");
const enableAudioBtn = document.getElementById("enableAudioBtn");
function formatTime(ms) {
  const t = Math.floor(ms / 1000);
  return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0");
}

function updateHoldHint() {
  holdHint.textContent = DEBUG ? "Debug · 3s" : "Hold for 60s";
}

function applyChakraTheme(index) {
  const c = chakras[index];
  rootStyle.setProperty("--chakra-color", c.color);
  rootStyle.setProperty("--chakra-glow",  c.glow);
}

function buildSessionBar() {
  sessionBarEl.innerHTML = "";
  chakras.forEach((c, i) => {
    const seg = document.createElement("div");
    seg.className = "session-seg";
    seg.dataset.index = i;
    seg.style.setProperty("--chakra-seg-color", c.color);
    sessionBarEl.appendChild(seg);
  });
}

function updateSessionBar() {
  const segs = sessionBarEl.querySelectorAll(".session-seg");
  segs.forEach((seg, i) => {
    seg.classList.remove("done","active");
    if (completed[i]) {
      seg.classList.add("done");
    } else if (i === currentChakra) {
      seg.classList.add("active");
    }
  });
}

function updateStatusPill() {
  const done = completed.filter(Boolean).length;
  if (done === chakras.length) {
    sessionStatus.classList.add("complete");
    sessionStatusTxt.innerHTML = '<span class="status-pill-dot"></span>Aligned';
  } else {
    sessionStatus.classList.remove("complete");
    sessionStatusTxt.textContent = done + "/7";
  }
}

function updateUIForChakra() {
  const chakra = chakras[currentChakra];
  applyChakraTheme(currentChakra);

  chipsContainer.querySelectorAll(".chip").forEach((chip, i) => {
    chip.classList.toggle("active", i === currentChakra);
    chip.classList.toggle("completed", completed[i]);
  });

  flaskLayers.forEach((layer, i) => {
    layer.classList.toggle("completed", completed[i]);
    layer.classList.remove("pulse");
    layer.style.background = `linear-gradient(to top, ${chakras[i].color} 0%, rgba(0,0,0,1) 100%)`;
    layer.style.opacity = completed[i] ? "0.92" : "0.14";
  });

  chakraNameEl.textContent = chakra.name;
  chakraFreqEl.textContent = chakra.freq + " Hz · binaural";
  updateStatusPill();
  updateSessionBar();
}

function resetTimerVisual() {
  holdStart = null;
  rootStyle.setProperty("--timer-progress", 0);
  timerDisplay.textContent = "00:00";
  timerRing.classList.add("idle");
  timerStatus.textContent = "Ready";
}

function startTimer() {
  holdStart = performance.now();
  timerRing.classList.remove("idle");

  const loop = () => {
    if (!isHolding || holdStart === null) return;
    const elapsed  = performance.now() - holdStart;
    const duration = getHoldDuration();
    const progress = Math.min(elapsed / duration, 1);
    rootStyle.setProperty("--timer-progress", progress);
    timerDisplay.textContent = formatTime(elapsed);
    updateSessionBar();

    if (elapsed >= duration) {
      completeCurrentHold();
    } else {
      holdRafId = requestAnimationFrame(loop);
    }
  };
  holdRafId = requestAnimationFrame(loop);
}

function stopTimer(reset) {
  if (holdRafId !== null) { cancelAnimationFrame(holdRafId); holdRafId = null; }
  if (reset) resetTimerVisual();
}

async function ensureAudio() {
  if (audioReady) return;
  try {
    await Tone.start();

    const limiter = new Tone.Limiter(-4).toDestination();
    const master = new Tone.Gain(0).connect(limiter);
    const filter = new Tone.Filter(800, "lowpass");
    const safetyLP = new Tone.Filter(8000, "lowpass");

    const chakra = chakras[currentChakra];
    const reverb = new Tone.Reverb({ decay: chakra.reverbDecay, wet: chakra.reverbWet });
    await reverb.ready;

    filter.connect(safetyLP);
    safetyLP.connect(reverb);
    reverb.connect(master);

    const leftOsc  = new Tone.Oscillator(chakra.freq - chakra.binauralDiff / 2, "sine");
    const rightOsc = new Tone.Oscillator(chakra.freq + chakra.binauralDiff / 2, "sine");

    const leftPan  = new Tone.Panner(-0.85);
    const rightPan = new Tone.Panner(0.85);
    const leftGain  = new Tone.Gain(0.5);
    const rightGain = new Tone.Gain(0.5);

    leftOsc.chain(leftPan, leftGain, filter);
    rightOsc.chain(rightPan, rightGain, filter);

    leftOsc.start();
    rightOsc.start();

    audioNodes = { master, filter, safetyLP, reverb, limiter, leftOsc, rightOsc, leftPan, rightPan, leftGain, rightGain };
    audioReady = true;

    applyChakraAudio(false);
  } catch (err) {
    console.error("Audio init error:", err);
    timerStatus.textContent = "Audio blocked";
  }
}

function applyChakraAudio(smooth) {
  if (!audioReady || !audioNodes) return;
  const chakra = chakras[currentChakra];
  const ramp = smooth ? 0.6 : 0.0;

  const diff = chakra.binauralDiff;
  audioNodes.leftOsc.frequency.rampTo(chakra.freq - diff / 2, ramp);
  audioNodes.rightOsc.frequency.rampTo(chakra.freq + diff / 2, ramp);

  const t      = toneScalar;
  const minMul = 0.55;
  const maxMul = 1.8;
  const mul    = minMul + (maxMul - minMul) * t;
  let cutoff   = chakra.freq * mul;
  cutoff = Math.max(120, Math.min(cutoff, chakra.filterCeil));
  audioNodes.filter.frequency.rampTo(cutoff, ramp > 0 ? ramp : 0.3);

  audioNodes.reverb.set({ decay: chakra.reverbDecay, wet: chakra.reverbWet });
}

function startSound() {
  if (!audioReady || !audioNodes) return;
  applyChakraAudio(true);
  const chakra = chakras[currentChakra];
  const target = volumeScalar * chakra.gainComp;
  const now = Tone.now();

  try { audioNodes.master.gain.cancelAndHoldAtTime(now); } catch(e) {
    audioNodes.master.gain.cancelScheduledValues(now);
  }
  audioNodes.master.gain.setValueAtTime(audioNodes.master.gain.value, now);
  audioNodes.master.gain.linearRampToValueAtTime(target, now + chakra.fadeIn);
}

function stopSound() {
  if (!audioReady || !audioNodes) return;
  const now = Tone.now();
  try { audioNodes.master.gain.cancelAndHoldAtTime(now); } catch(e) {
    audioNodes.master.gain.cancelScheduledValues(now);
  }
  audioNodes.master.gain.setValueAtTime(audioNodes.master.gain.value, now);
  audioNodes.master.gain.linearRampToValueAtTime(0, now + 0.7);
}

function applyVolumeFromSlider(smooth) {
  const val = parseInt(volumeSlider.value, 10) || 0;
  volumeScalar = (val / 100) * 0.11;
  if (!audioReady || !audioNodes) return;
  if (!isHolding) return;
  const chakra = chakras[currentChakra];
  const target = volumeScalar * chakra.gainComp;
  const now = Tone.now();
  try { audioNodes.master.gain.cancelAndHoldAtTime(now); } catch(e) {
    audioNodes.master.gain.cancelScheduledValues(now);
  }
  audioNodes.master.gain.setValueAtTime(audioNodes.master.gain.value, now);
  audioNodes.master.gain.linearRampToValueAtTime(target, now + (smooth ? 0.2 : 0));
}

function applyToneFromSlider() {
  toneScalar = (parseInt(toneSlider.value, 10) || 0) / 100;
  if (audioReady && audioNodes) applyChakraAudio(true);
}

volumeSlider.addEventListener("input", () => {
  applyVolumeFromSlider(true);
  try { localStorage.setItem("chrysasynth_vol", volumeSlider.value); } catch(e){}
});

toneSlider.addEventListener("input", () => {
  applyToneFromSlider();
  try { localStorage.setItem("chrysasynth_tone", toneSlider.value); } catch(e){}
});

function vibrate() {
  if ("vibrate" in navigator) navigator.vibrate(80);
}

function completeCurrentHold() {
holdRequested = false;
  isHolding = false;
  stopTimer(false);
  stopSound();

  completed[currentChakra] = true;
  const layer = flaskLayers[currentChakra];
  layer.classList.add("completed", "pulse");
  setTimeout(() => layer.classList.remove("pulse"), 900);

  vibrate();

  timerDisplay.textContent = formatTime(getHoldDuration());
  rootStyle.setProperty("--timer-progress", 1);
  holdButton.classList.remove("active");
  timerStatus.textContent = "Done";
  holdHint.textContent = "Next chakra";

  const allDone = completed.every(Boolean);
  if (allDone) {
    flaskEl.classList.add("glow-final");
    updateStatusPill();
  } else {
    const next = completed.findIndex((c, i) => !c && i > currentChakra);
    currentChakra = next !== -1 ? next : completed.findIndex(c => !c);
  }

  setTimeout(() => {
    if (!allDone) { resetTimerVisual(); updateHoldHint(); }
    updateUIForChakra();
  }, 800);
}

function cancelHold() {
  holdRequested = false;

  if (!isHolding) {
    timerStatus.textContent = "Released";
    updateHoldHint();
    return;
  }

  isHolding = false;
  stopTimer(true);
  stopSound();
  holdButton.classList.remove("active");
  timerStatus.textContent = "Released";
  updateHoldHint();
}

async function startHold() {
if (!audioPrimed) return;
  if (completed.every(Boolean)) return;
  if (holdRequested || isHolding) return;

  holdRequested = true;
  timerStatus.textContent = "Loading…";

  await ensureAudio();

  if (!holdRequested) {
    timerStatus.textContent = "Ready";
    updateHoldHint();
    return;
  }

  isHolding = true;
  holdButton.classList.add("active");
  timerStatus.textContent = "Holding";
  updateHoldHint();

  startSound();
  resetTimerVisual();
  startTimer();
}
async function enableAudio() {
  if (audioPrimed) return;

  enableAudioBtn.disabled = true;
  enableAudioBtn.textContent = "Loading…";

  await ensureAudio();

  audioPrimed = true;

  startScreen.style.display = "none";
}
function bindHoldEvents() {
  const endHold = (e) => {
    if (isHolding || holdRequested) cancelHold();

    try {
      if (e && e.pointerId != null && holdButton.hasPointerCapture?.(e.pointerId)) {
        holdButton.releasePointerCapture(e.pointerId);
      }
    } catch (err) {}
  };

  holdButton.addEventListener("pointerdown", async (e) => {
    e.preventDefault();

    try {
      holdButton.setPointerCapture(e.pointerId);
    } catch (err) {}

    if (!isHolding && !holdRequested) {
      await startHold();
    }
  });

  holdButton.addEventListener("pointerup", endHold);
  holdButton.addEventListener("pointercancel", endHold);
  holdButton.addEventListener("lostpointercapture", () => {
    if (isHolding || holdRequested) cancelHold();
  });

  window.addEventListener("blur", () => {
    if (isHolding || holdRequested) cancelHold();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && (isHolding || holdRequested)) cancelHold();
  });
}

function createChakraChips() {
  chakras.forEach((chakra, index) => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.dataset.index = index;

    const dot = document.createElement("span");
    dot.className = "chip-dot";
    dot.style.background = chakra.color;

    const label = document.createElement("span");
    label.textContent = chakra.name;

    chip.append(dot, label);

    chip.addEventListener("click", () => {
      if (isHolding) cancelHold();
      currentChakra = index;
      updateUIForChakra();
      resetTimerVisual();
      updateHoldHint();
      if (audioReady) applyChakraAudio(true);
    });

    chipsContainer.appendChild(chip);
  });
}

function initFlaskColors() {
  flaskLayers.forEach((layer, i) => {
    layer.style.background = `linear-gradient(to top, ${chakras[i].color} 0%, rgba(0,0,0,1) 100%)`;
  });
}

function bindDebugToggle() {
  if (!debugToggle) return;
  debugToggle.addEventListener("click", e => {
    e.preventDefault();
    DEBUG = !DEBUG;
    debugToggle.classList.toggle("debug-on", DEBUG);
    timerStatus.textContent = DEBUG ? "Debug" : "Ready";
    stopTimer(true);
    updateHoldHint();
  });
  window.addEventListener("keydown", e => {
    if (e.key && e.key.toLowerCase() === "d") debugToggle.click();
  });
}

function restoreSliders() {
  try {
    const sv = localStorage.getItem("chrysasynth_vol");
    const st = localStorage.getItem("chrysasynth_tone");
    if (sv !== null) volumeSlider.value = sv;
    if (st !== null) toneSlider.value   = st;
  } catch(e) {}
  volumeScalar = ((parseInt(volumeSlider.value,10)||40) / 100) * 0.11;
  toneScalar   = (parseInt(toneSlider.value,10)||60) / 100;
}

function init() {
  restoreSliders();
  buildSessionBar();
  createChakraChips();
  initFlaskColors();
  bindHoldEvents();
  bindDebugToggle();
  resetTimerVisual();
  updateUIForChakra();
  updateHoldHint();
  if (enableAudioBtn) {
  enableAudioBtn.addEventListener("click", enableAudio);
}
}

document.addEventListener("DOMContentLoaded", init);

function reportHeight() {
  const h = document.body.scrollHeight;
  try {
    window.parent.postMessage({ type:"setHeight", height:h }, "*");
    window.parent.postMessage({ iframe:true, height:h }, "*");
    window.parent.postMessage("height:" + h, "*");
  } catch(e) {}
  
}
window.addEventListener("load", reportHeight);
if (window.ResizeObserver) {
  new ResizeObserver(reportHeight).observe(document.body);
} else {
  window.addEventListener("resize", reportHeight);
}
</script>
